[package]
name = "rustmaniax-sdk"
version = "1.3.0"
edition = "2024"
description = "Rust SDK for StepManiaX dance pad controllers"
license = "MIT"
repository = "https://github.com/fchorney/rustmaniax-sdk"
homepage = "https://github.com/fchorney/rustmaniax-sdk"
documentation = "https://docs.rs/rustmaniax-sdk"

[features]
sample = ["dep:ctrlc", "dep:env_logger"]

[dependencies]
hidapi = { version = "2.6.5", default-features = false }
log = "0.4.29"
bytemuck = { version = "1.25.0", features = ["derive"] }
bitflags = "2.11.1"
image = { version = "0.25.10", default-features = false, features = ["gif"] }

# Used by smx-sample binary only.
ctrlc = { version = "3.4.5", optional = true }
env_logger = { version = "0.11.10", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["windows-native"] }

[[bin]]
name = "smx-sample"
path = "src/bin/sample.rs"
required-features = ["sample"]

[[bin]]
name = "smx-sensor-rate"
path = "src/bin/sensor_rate.rs"
required-features = ["sample"]

[[bin]]
name = "smx-rw-probe"
path = "src/bin/rw_probe.rs"
required-features = ["sample"]

[lints.clippy]
perf = { level = "warn", priority = -1 }
