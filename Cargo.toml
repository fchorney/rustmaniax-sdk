[package]
name = "rustmaniax-sdk"
version = "2.1.0"
edition = "2024"
description = "Rust SDK for StepManiaX dance pad controllers"
license = "MIT"
repository = "https://github.com/fchorney/rustmaniax-sdk"
homepage = "https://github.com/fchorney/rustmaniax-sdk"
documentation = "https://docs.rs/rustmaniax-sdk"

[features]
sample = ["dep:ctrlc", "dep:env_logger", "dep:crossterm"]

[dependencies]
hidapi = { version = "2.6.5", default-features = false }
log = "0.4.29"
bytemuck = { version = "1.25.0", features = ["derive"] }
bitflags = "2.11.1"
image = { version = "0.25.10", default-features = false, features = ["gif"] }

# Used by sample binaries only.
ctrlc = { version = "3.4.5", optional = true }
env_logger = { version = "0.11.10", optional = true }
crossterm = { version = "0.27", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["windows-native"] }

# macOS opens IOHIDDevice exclusively by default, so a second open of the same
# path fails with kIOReturnExclusiveAccess. This feature makes HidApi::new call
# hid_darwin_set_open_exclusive(0) so the read and write handles can share one
# device. Linux (hidraw) and Windows already allow shared opens.
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["macos-shared-device"] }

[[bin]]
name = "smx-sample"
path = "src/bin/sample.rs"
required-features = ["sample"]

[[bin]]
name = "smx-sensor-rate"
path = "src/bin/sensor_rate.rs"
required-features = ["sample"]

[[bin]]
name = "smx-rw-probe"
path = "src/bin/rw_probe.rs"
required-features = ["sample"]

[[bin]]
name = "smx-input-timing"
path = "src/bin/input_timing.rs"
required-features = ["sample"]

[lints.clippy]
perf = { level = "warn", priority = -1 }
